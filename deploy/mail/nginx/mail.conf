# nginx: the relay's API for the boxes, on the host's HTTPS. Include from the server block for
# mx.localghost.ai (or add this location to the site's block and point the boxes at that host).
# Everything under /box/ goes to ghost.maild on loopback; the rest of the host can be the site.
location /box/ {
    proxy_pass http://127.0.0.1:8025;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    client_max_body_size 40m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
# MTA-STS (RFC 8461): the policy file the large senders read, served from mta-sts.<domain>.
# For the box domains this is the box owner's job; for localghost.ai itself (deploy/mail/etc/mta-sts.txt):
#   server { server_name mta-sts.localghost.ai; location = /.well-known/mta-sts.txt { ... } }
