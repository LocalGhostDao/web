# mirror.conf , what https://www.localghost.ai/mirror carries. Read by deploy/mirror/publish.sh on the web
# server; boxes fetch a set with tools/mirror_fetch.sh <set> <dir> (in the LocalGhost server repo).
#
#   set   file   terms   source   [check=godev]
#
# set     what a box asks for (geo, landpolygons, go, llama, models, or a new one: maps, ...)
# file    the file's name on the mirror and at its destination (world.geojson, not ne_10m_...)
# terms   one or more comma-separated names of files in deploy/mirror/terms/ (without .txt). Each is
#         published beside the file as TERMS-<name>.txt and covered by the signature. A terms file
#         that still says EDIT-ME stops the publish; one whose first line is "#fetch <url>" is
#         downloaded from there (the Apache 2.0 text, for instance).
# source  an https URL (fetched only when upstream changed: curl -z against the cached copy) or a
#         path on the server (a model, a map you downloaded). The mirror publishes the file as it
#         is; any processing (cutting the coastline into tiles, say) happens on the box.
# check=godev  the Go tarball must match go.dev's published checksum, or the publish stops.

# --- geo: GeoNames (reverse geocoding) and Natural Earth (the map's base). Into <volume>/geo. ---
geo  admin1CodesASCII.txt  geonames      https://download.geonames.org/export/dump/admin1CodesASCII.txt
geo  admin2Codes.txt       geonames      https://download.geonames.org/export/dump/admin2Codes.txt
geo  countryInfo.txt       geonames      https://download.geonames.org/export/dump/countryInfo.txt
geo  allCountries.zip      geonames      https://download.geonames.org/export/dump/allCountries.zip
geo  world.geojson         naturalearth  https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson
geo  world-50m.geojson     naturalearth  https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson
geo  world-110m.geojson    naturalearth  https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson

# --- landpolygons: OpenStreetMap's land polygons, unmodified. The box cuts them into its map's ---
# --- coastline tiles itself (cmd/ghost-landtiles in the server repo).                          ---
landpolygons  land-polygons-complete-4326.zip  osm-odbl  https://osmdata.openstreetmap.de/download/land-polygons-complete-4326.zip

# --- go: the toolchain setup.sh installs, before any Go exists on the box. ---
go  go1.25.4.linux-amd64.tar.gz  go-bsd  https://dl.google.com/go/go1.25.4.linux-amd64.tar.gz  check=godev

# --- llama: the inference engine's source, PINNED: every box builds the same llama.cpp instead of ---
# --- whatever master was that morning. The commit the box runs today:                             ---
# ---   git -C /opt/localghost/llama.cpp rev-parse HEAD                                             ---
# --- The file name carries the commit, so a new pin is a new name and boxes rebuild.               ---
# llama  llama.cpp-<commit>.tar.gz  llama-mit  https://github.com/ggml-org/llama.cpp/archive/<commit>.tar.gz

# --- models: the weights, from files on the server. Gemma 4 is Apache 2.0; EmbeddingGemma is under  ---
# --- the Gemma Terms of Use, which must travel with it in full (deploy/mirror/terms/gemma-terms.txt). ---
# models  gemma-4-12b-it-Q4_K_M.gguf   apache-2.0,gemma4  /srv/models/gemma-4-12b-it-Q4_K_M.gguf
# models  mmproj-F16.gguf              apache-2.0,gemma4  /srv/models/mmproj-F16.gguf
# models  embeddinggemma-300m-q8.gguf  gemma-terms        /srv/models/embeddinggemma-300m-q8.gguf

# --- anything else (a map, a future model): a line in a set of its own, and its terms file in       ---
# --- deploy/mirror/terms/. A future model's set keeps its mmproj from colliding with this one's.     ---
# maps  <file>  <terms>  /srv/data/<file>
