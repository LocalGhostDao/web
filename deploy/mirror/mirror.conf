# mirror.conf , what https://www.localghost.ai/mirror carries. Read by deploy/mirror/publish.sh on the web
# server; boxes fetch a set with tools/mirror_fetch.sh <set> <dir> (in the LocalGhost server repo).
#
#   set   file   terms   source   [check=godev] [check=sha256:<hex>] [check=sha256:?] [check=sumfile]
#                                  [list=<url>] [manual]
#
# set     what a box asks for (geo, landpolygons, roads, tz, elevation, go, llama, whisper, models,
#         speech, embeddings, phone, wikipedia, server, app, or a new one: maps, ...)
# file    the file's name on the mirror and at its destination (world.geojson, not ne_10m_...)
# terms   one or more comma-separated names of files in deploy/mirror/terms/ (without .txt). Each is
#         published beside the file as TERMS-<name>.txt and covered by the signature. A terms file
#         that still says EDIT-ME leaves its whole set out of the build (loudly) until it's finished;
#         one whose first line is "#fetch <url>" is downloaded from there (the Apache 2.0 text).
# source  an https URL (fetched only when upstream changed: curl -z against the cached copy) or a
#         path on the server (a model, a map you downloaded). The mirror publishes the file as it
#         is; any processing (cutting the coastline into tiles, say) happens on the box. A * in the
#         last part of the URL (wikipedia_en_all_nopic_*.zim) means the newest of a dated series:
#         the directory listing is read and the last match in sort order is fetched; the file keeps
#         the name in the file column and NOTICE.txt records which dated file it was.
# check=godev  the Go tarball must match go.dev's published checksum, or the publish stops.
# check=sha256:<hex>  the file is pinned: it must have exactly this SHA-256 (take it from the
#         upstream's own listing, e.g. the SHA256 on a Hugging Face file page). It is downloaded, or
#         copied from a server path, once and never fetched again; a new version is a new pin.
# check=sumfile  the file must match the SHA-256 upstream publishes beside it at <url>.sha256
#         (download.kiwix.org does this for every ZIM), or the publish stops.
# list=<url>  one line for many files: <url> is a list of names, one per line, and {name} in the
#         file and the source is replaced by each (the 26,000 Copernicus DEM tiles). Expanded only
#         when the set is refreshed.
# check=sha256:?  the pin is still to be taken (an upstream that publishes no checksum, like a
#         GitHub source archive): the publish downloads the file once, prints its SHA-256 and the
#         line to put here, keeps the copy in the cache under that hash, and leaves the set out
#         until the hash is here. So the first hash a box ever sees is one you read off the server.
# manual  the set is refreshed only when named (publish.sh roads), never by a plain publish or a
#         deploy; until then each build carries whatever the previous build had. For sets whose
#         upstream changes daily and weighs tens of GB.

# --- geo: GeoNames (reverse geocoding) and Natural Earth (the map's base). Into <volume>/geo. ---
geo  admin1CodesASCII.txt  geonames      https://download.geonames.org/export/dump/admin1CodesASCII.txt
geo  admin2Codes.txt       geonames      https://download.geonames.org/export/dump/admin2Codes.txt
geo  countryInfo.txt       geonames      https://download.geonames.org/export/dump/countryInfo.txt
geo  allCountries.zip      geonames      https://download.geonames.org/export/dump/allCountries.zip
geo  world.geojson         naturalearth  https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson
geo  world-50m.geojson     naturalearth  https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson
geo  world-110m.geojson    naturalearth  https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson

# --- landpolygons: OpenStreetMap's land polygons, unmodified. The box cuts them into its map's ---
# --- coastline tiles itself (cmd/ghost-landtiles in the server repo).                          ---
landpolygons  land-polygons-complete-4326.zip  osm-odbl  https://osmdata.openstreetmap.de/download/land-polygons-complete-4326.zip

# --- roads: OpenStreetMap's roads as Geofabrik's continent extracts, unmodified, about 80 GB in    ---
# --- all (Europe alone 33 GB). Each box cuts the ones it asks for into road tiles itself           ---
# --- (bin/ghost-roadtiles in the server repo); a box never fetches this set unless setup is told   ---
# --- to (GHOST_GEO_ROADS). Geofabrik republishes every extract DAILY, so this set is "manual":     ---
# --- a deploy leaves it alone; `deploy/mirror/publish.sh --sign-later roads`, about monthly, in     ---
# --- screen, refreshes it (an hour or more, every changed extract downloaded whole, with a progress ---
# --- meter), and `publish.sh --sign` signs the result and puts it live whenever you're back.        ---
roads  africa-latest.osm.pbf             osm-odbl  https://download.geofabrik.de/africa-latest.osm.pbf             manual
roads  antarctica-latest.osm.pbf         osm-odbl  https://download.geofabrik.de/antarctica-latest.osm.pbf         manual
roads  asia-latest.osm.pbf               osm-odbl  https://download.geofabrik.de/asia-latest.osm.pbf               manual
roads  australia-oceania-latest.osm.pbf  osm-odbl  https://download.geofabrik.de/australia-oceania-latest.osm.pbf  manual
roads  central-america-latest.osm.pbf    osm-odbl  https://download.geofabrik.de/central-america-latest.osm.pbf    manual
roads  europe-latest.osm.pbf             osm-odbl  https://download.geofabrik.de/europe-latest.osm.pbf             manual
roads  north-america-latest.osm.pbf      osm-odbl  https://download.geofabrik.de/north-america-latest.osm.pbf      manual
roads  south-america-latest.osm.pbf      osm-odbl  https://download.geofabrik.de/south-america-latest.osm.pbf      manual

# --- tz: the time zone of a place, so days are cut at local midnight instead of UTC. The boundaries ---
# --- are timezone-boundary-builder's "with oceans, since 1970" build (zones that have agreed on the  ---
# --- clock since 1970 are merged, which is right for any photo after 1970; the oceans are the       ---
# --- Etc/GMT+-N zones a boat sits in). The rules for each zone are IANA's tzdata. Both are fetched  ---
# --- from stable "latest" URLs, so the monthly check picks up a new release by itself.             ---
tz  timezones-with-oceans-1970.geojson.zip  timezones-odbl  https://github.com/evansiroky/timezone-boundary-builder/releases/latest/download/timezones-with-oceans-1970.geojson.zip
tz  tzdata-latest.tar.gz                    tzdata          https://data.iana.org/time-zones/tzdata-latest.tar.gz

# --- elevation: Copernicus DEM GLO-90, the whole world's land at 90 m, one Cloud Optimised GeoTIFF  ---
# --- per 1x1 degree tile, unmodified, from the copy on the AWS open data registry. About 26,000      ---
# --- tiles and on the order of 100 GB, so it is "manual": `publish.sh --sign-later elevation`, once, ---
# --- in screen; the tiles don't change between Copernicus releases. The licence asks that everyone   ---
# --- who receives the data is bound by it, so the licence PDF itself is a file in the set.           ---
# --- A box fetches only the tiles it needs (tileList.txt says which exist).                          ---
elevation  {name}.tif                   copernicus-dem  https://copernicus-dem-90m.s3.amazonaws.com/{name}/{name}.tif  list=https://copernicus-dem-90m.s3.amazonaws.com/tileList.txt  manual
elevation  tileList.txt                 copernicus-dem  https://copernicus-dem-90m.s3.amazonaws.com/tileList.txt  manual
elevation  copernicus-dem-licences.pdf  copernicus-dem  https://dataspace.copernicus.eu/sites/default/files/media/files/2025-06/copernicus_contributing_mission_data_access_v2_cop_dem_licenses.pdf  manual

# --- wikipedia: English Wikipedia without pictures, as Kiwix packages it (one ZIM file with its own   ---
# --- full-text index, read by kiwix-serve on the box), checked against the SHA-256 Kiwix publishes   ---
# --- beside every ZIM. Kiwix rebuilds it every month or two; `publish.sh --sign-later wikipedia`     ---
# --- takes the newest (about 60 GB) and drops the older copy from the cache.                         ---
wikipedia  wikipedia_en_all_nopic.zim  wikipedia  https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_nopic_*.zim  check=sumfile  manual
# --- with pictures, about twice the size, for a box that wants the reader as well as the search:     ---
# wikipedia  wikipedia_en_all_maxi.zim  wikipedia  https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_maxi_*.zim  check=sumfile  manual
# --- introductions only, a few GB, small enough for the phone when there is no box at all:           ---
# wikipedia-mini  wikipedia_en_all_mini.zim  wikipedia  https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_mini_*.zim  check=sumfile  manual

# --- go: the toolchain setup.sh installs, before any Go exists on the box. ---
go  go1.25.4.linux-amd64.tar.gz  go-bsd  https://dl.google.com/go/go1.25.4.linux-amd64.tar.gz  check=godev

# --- llama: the inference engine's source, PINNED: every box builds the same llama.cpp instead of ---
# --- whatever master was that morning. v0.5.0 is ggml-org's stable release of 23 September 2026    ---
# --- (the vX.Y.Z tags are the ones they recommend for downstream distribution; the b-number tags   ---
# --- are the bleeding edge), commit 7fe450e19305b828c199d602c23a8337aaa1f03b. The URL names the    ---
# --- commit, which can't move; the file name carries the release and the commit, so a new pin is   ---
# --- a new name and boxes rebuild. GitHub publishes no checksum for source archives, so the pin is  ---
# --- the hash of the first copy the web server downloaded (check=sha256:? prints it; paste it in).  ---
# --- To pin whatever a box runs instead:  git -C /opt/localghost/llama.cpp rev-parse HEAD           ---
llama  llama.cpp-v0.5.0-7fe450e.tar.gz  llama-mit  https://github.com/ggml-org/llama.cpp/archive/7fe450e19305b828c199d602c23a8337aaa1f03b.tar.gz  check=sha256:a6861d549427f814dc591c439e08206f67ffaba0248344d421589abf18199e67

# --- whisper: the speech engine's source, pinned exactly like llama.cpp, so every box builds the   ---
# --- same whisper.cpp. v1.9.4 is ggml-org's stable release of 11 September 2026, commit           ---
# --- 927cfce34f31707e17f2bff35c349632fb9e2c3a, fetched by commit so the URL can't move. GitHub    ---
# --- publishes no checksum for source archives, so the pin is the hash of the first copy this     ---
# --- server downloaded, on 29 September 2026 (check=sha256:? printed it).                         ---
whisper  whisper.cpp-v1.9.4-927cfce.tar.gz  whisper-mit  https://github.com/ggml-org/whisper.cpp/archive/927cfce34f31707e17f2bff35c349632fb9e2c3a.tar.gz  check=sha256:41b664fee09e79176ac277b5237debec34f8d74af3c7d71f333f1ec67989ecde

# --- speech: the model a box transcribes voice notes with (the daily check-in), OpenAI's Whisper    ---
# --- large-v3-turbo, multilingual, in the whisper.cpp maintainers' ggml build quantised to q5_0     ---
# --- (574 MB, MIT, not gated): https://huggingface.co/ggerganov/whisper.cpp                          ---
# --- Pinned by the SHA-256 on its Hugging Face file page. Its own set, apart from the chat models.  ---
speech  ggml-large-v3-turbo-q5_0.bin  openai-whisper  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin  check=sha256:394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2

# --- models: the weights every box runs, fetched from Hugging Face with plain HTTPS (no account, no  ---
# --- CLI) and pinned. Gemma 4 12B instruct, Q4_K_M, and its F16 vision projector, as quantised and    ---
# --- published by Unsloth (Apache 2.0): https://huggingface.co/unsloth/gemma-4-12b-it-GGUF            ---
# --- File names are Unsloth's, so boxes keep the paths llama-server already uses. A copy you already  ---
# --- have works too: put it on the server and swap the URL for its path; it's published only if its  ---
# --- sha256 matches the pin. A new upstream version is a new pin (and a deliberate choice).           ---
models  gemma-4-12b-it-Q4_K_M.gguf  apache-2.0,gemma4  https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-Q4_K_M.gguf  check=sha256:0a270ec9fe6b34f4a0d33992b6135117b484ebc4766ab76b51d4ae8c457e4c42
models  mmproj-F16.gguf             apache-2.0,gemma4  https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/mmproj-F16.gguf             check=sha256:91f086971e56d7a7d8d39e271873fccdb49541bd259d6e02c401a4f1cb7a219e

# --- phone: Gemma 4 E2B instruct for the phone app, Unsloth's dynamic 2-bit quantisation (UD-Q2_K_XL, ---
# --- 2.2 GB) of Google's quantisation-aware checkpoint, Apache 2.0, not gated:                        ---
# ---   https://huggingface.co/unsloth/gemma-4-E2B-it-qat-GGUF                                         ---
# --- Its own set, so a phone fetches this and nothing else. The same repo has mmproj-F16.gguf (986 MB, ---
# --- sha256 13c8966d1635d02e6727f27402880614906fa291850c07feda18dbcddf2291b6) for when the phone build ---
# --- does vision: a second line here, and its own set keeps it apart from the 12B projector.          ---
phone  gemma-4-E2B-it-qat-UD-Q2_K_XL.gguf  apache-2.0,gemma4  https://huggingface.co/unsloth/gemma-4-E2B-it-qat-GGUF/resolve/main/gemma-4-E2B-it-qat-UD-Q2_K_XL.gguf  check=sha256:0a5bbc20f91f92da96ab4870fa71b356c45b8500a7b8b9c3e0eb48359b72da28

# --- embeddings: EmbeddingGemma 300M for search over a box's own notes, as Google's quantisation-  ---
# --- aware Q8_0 checkpoint (google/embeddinggemma-300m-qat-q8_0-unquantized) converted to GGUF by   ---
# --- the llama.cpp maintainers: https://huggingface.co/ggml-org/embeddinggemma-300m-qat-q8_0-GGUF   ---
# --- (not gated, plain HTTPS, 329 MB). Pinned by the SHA-256 on its Hugging Face file page.         ---
# --- EmbeddingGemma is under the Gemma Terms of Use (not Apache 2.0), which must travel with it in   ---
# --- full: the set is left out until deploy/mirror/terms/gemma-terms.txt holds the whole text and   ---
# --- no longer says EDIT-ME. Its own set, so it can't hold up the Gemma 4 weights.                  ---
embeddings  embeddinggemma-300m-qat-Q8_0.gguf  gemma-terms  https://huggingface.co/ggml-org/embeddinggemma-300m-qat-q8_0-GGUF/resolve/main/embeddinggemma-300m-qat-Q8_0.gguf  check=sha256:6fa0c02a9c302be6f977521d399b4de3a46310a4f2621ee0063747881b673f67

# --- server: LocalGhost's own releases, the set a phone offers to DEPLOY ("wisp 0.0.2 is out"). The  ---
# --- files are the GitHub release's, unmodified, pinned by the SHA-256 GitHub shows beside each asset  ---
# --- (the release's own signed SHA256SUMS states the same hashes). tools/cut_release.sh in the server ---
# --- repo builds the bundle reproducibly from the tag, so anyone can check a pin by cutting the same  ---
# --- version themselves. The box reads RELEASE.txt (bundle= names the tarball), checks this set       ---
# --- against the signed manifest with mirror_fetch.sh over file://, unpacks the bundle and keeps the  ---
# --- previous build to roll back to. The release's own NOTICE.txt and SHA256SUMS are left out: this   ---
# --- set's NOTICE.txt is the mirror's, and the manifest is the sums. A release is these lines with    ---
# --- the new names, tag and pins (wisp 0.0.2, 2 October 2026, commit c9d82c0, replaced 0.0.1).       ---
server  localghost-server-0.0.2-linux-amd64.tar.gz  localghost-mit  https://github.com/LocalGhostDao/localghost/releases/download/v0.0.2/localghost-server-0.0.2-linux-amd64.tar.gz  check=sha256:c79f28946e94f81fd75c205ec79d678464d92506ff640e862441d20dbc5e56c9
server  RELEASE.txt                                 localghost-mit  https://github.com/LocalGhostDao/localghost/releases/download/v0.0.2/RELEASE.txt                                 check=sha256:293bbd19b8cd74b64141203557ee1d07a51f1bd231cfc2aa951d1eb5409150a2
server  NOTES.md                                    localghost-mit  https://github.com/LocalGhostDao/localghost/releases/download/v0.0.2/NOTES.md                                    check=sha256:d2bc343391405588258389c5d647017c0a50c7831e35198d380e0fcd0b1b66da

# --- app: the Android app from the same release, the APK GitHub carries, unmodified, signed with     ---
# --- the app's own keystore (signing certificate SHA-256 3D:CC:5E:35:71:80:36:A2:6C:F3:63:73:EE:53:   ---
# --- E7:9F:51:2B:F0:2D:97:F7:01:70:52:99:6D:55:DD:F0:CD:F4, the same key since 0.0.1, so it installs   ---
# --- over the last one and keeps the enrolment), the site key's detached signature beside it, and     ---
# --- APP.txt (its hash, commit, version and certificate). A phone installs it once by hand; on the    ---
# --- mirror it means a USB copy of the mirror can set up the phone as well as the box. The APK        ---
# --- carries AndroidX, Compose and Kotlin (Apache 2.0) and llama.cpp (MIT) besides LocalGhost's own   ---
# --- code, so all three terms travel. The APK is not byte-reproducible yet: the pin is the release's. ---
app  localghost-app-0.0.2.apk      localghost-app,apache-2.0,localghost-mit  https://github.com/LocalGhostDao/localghost/releases/download/v0.0.2/localghost-app-0.0.2.apk      check=sha256:1a05f0a547ce4555bfa416d966bac05b861707c717dca9c7723f1ee552cf4d04
app  localghost-app-0.0.2.apk.asc  localghost-app,apache-2.0,localghost-mit  https://github.com/LocalGhostDao/localghost/releases/download/v0.0.2/localghost-app-0.0.2.apk.asc  check=sha256:dc5c567d6a672682fd0352af2e273169b63a4d731e30be16e29c77a715180fa4
app  APP.txt                       localghost-app,apache-2.0,localghost-mit  https://github.com/LocalGhostDao/localghost/releases/download/v0.0.2/APP.txt                       check=sha256:02e59dc043177631b7d328f7946179a830f67da576f619c05f689350f73a3857

# --- anything else (a map, a future model): a line in a set of its own, and its terms file in       ---
# --- deploy/mirror/terms/. A future model's set keeps its mmproj from colliding with this one's.     ---
# maps  <file>  <terms>  /srv/data/<file>
