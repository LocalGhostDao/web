<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
<title>Caffeine and Spite, LocalGhost Hard Truths</title>
<desc>LocalGhost.ai social card for the Hard Truths post on an AskReddit thread asking millennials how they are holding up.</desc>

<defs>
<pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="4" height="2" fill="#000000" fill-opacity="0.10"/>
<rect x="0" y="2" width="4" height="2" fill="#000000" fill-opacity="0.00"/>
</pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<style>
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
.green { fill: #33FF00; }
.dim { fill: #1a8000; }
.text { fill: #E0E0E0; }
.text-dim { fill: #a0a0a0; }
.border { stroke: #1a8000; fill: none; }
.divider { stroke: #444444; fill: none; }
</style>

<rect x="0" y="0" width="1200" height="630" fill="#111111"/>
<rect x="0" y="0" width="1200" height="630" fill="url(#scanlines)"/>

<rect x="20" y="20" width="1160" height="590" class="border" stroke-width="1"/>
<rect x="28" y="28" width="1144" height="574" stroke="#1a8000" stroke-opacity="0.25" fill="none" stroke-width="1"/>

<text x="80" y="98" class="mono green" font-size="22" font-weight="500" letter-spacing="3" filter="url(#glow)">&gt; HARD_TRUTHS // POST_19 // OCT 2026</text>

<line x1="80" y1="130" x2="1120" y2="130" class="divider" stroke-width="1"/>

<text x="80" y="236" class="mono text" font-size="72" font-weight="700">Caffeine and Spite</text>

<line x1="80" y1="300" x2="200" y2="300" stroke="#33FF00" stroke-width="2"/>

<text x="80" y="356" class="mono text-dim" font-size="22" font-weight="400">Millennials are holding up badly, mostly. The world</text>
<text x="80" y="388" class="mono text-dim" font-size="22" font-weight="400">is better than it feels by most of the numbers, and</text>
<text x="80" y="420" class="mono text-dim" font-size="22" font-weight="400">the tide that lifted it is going out.</text>

<g class="mono" font-size="17" fill="#a0a0a0">
    <text x="80" y="500">child deaths <tspan fill="#33ff00">-60%</tspan> since 1990  |  <tspan fill="#33ff00">1.5bn</tspan> out of poverty  |  trade peaked at <tspan fill="#33ff00">61%</tspan> of GDP, 2008</text>
</g>

<line x1="80" y1="556" x2="1120" y2="556" class="divider" stroke-width="1"/>

<text x="80" y="586" class="mono green" font-size="20" font-weight="500" letter-spacing="2" filter="url(#glow)">&gt; LOCALGHOST.AI</text>
<text x="305" y="586" class="mono text-dim" font-size="16" font-weight="400">| THE ONLY CLOUD IS YOU</text>

<text x="1120" y="586" class="mono dim" font-size="18" font-weight="500" text-anchor="end" letter-spacing="1">ask it back</text>

<g transform="translate(1010, 150)" opacity="0.95">
  <path d="M 0,0 L 0,120 L 12,106 L 24,120 L 36,106 L 48,120 L 60,106 L 72,120 L 84,106 L 96,120 L 96,0 Q 96,-52 48,-52 Q 0,-52 0,0 Z"
        fill="#111111" stroke="#33FF00" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="30" cy="-14" r="6" fill="#33FF00"/>
  <circle cx="66" cy="-14" r="6" fill="#33FF00"/>
  <path d="M 34,16 Q 48,28 62,16" stroke="#33FF00" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

</svg>
