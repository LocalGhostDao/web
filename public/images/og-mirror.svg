    <path d="M65,195 Q125,250 185,195" fill="none" stroke="#33ff00" stroke-width="6"/>
  </g>
  <text x="1120" y="600" text-anchor="end" fill="#1a8000" font-family="monospace" font-size="18">LOCALGHOST.AI // THE ONLY CLOUD IS YOU</text>
