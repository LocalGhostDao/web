    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#111111"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ghost -->
  <g transform="translate(90, 170) scale(0.9)">
    <path d="M125,0 C194,0 250,56 250,125 L250,310 L218,275 L187,310 L156,275 L125,310 L94,275 L62,310 L31,275 L0,310 L0,125 C0,56 56,0 125,0 Z" fill="none" stroke="#33ff00" stroke-width="5"/>
    <circle cx="80" cy="130" r="22" fill="#33ff00"/>
    <circle cx="170" cy="130" r="22" fill="#33ff00"/>
    <path d="M65,195 Q125,250 185,195" fill="none" stroke="#33ff00" stroke-width="5"/>
  </g>

  <!-- Window bar -->
