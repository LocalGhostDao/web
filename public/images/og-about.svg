  <text x="420" y="200" fill="#33ff00" font-family="monospace" font-size="22" letter-spacing="6">&gt; ABOUT</text>
  <text x="420" y="275" fill="#E0E0E0" font-family="monospace" font-size="64" font-weight="bold">LocalGhost</text>

  <text x="420" y="340" fill="#a0a0a0" font-family="monospace" font-size="24">Open-source personal AI that builds</text>
