<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Native UI component examples for LocalGhost." />
    <link rel="stylesheet" href="./src/css/index.css" />
    <title>LocalGhost UI</title>
  </head>
  <body>
    <main class="demo">
      <p class="eyebrow">LocalGhost UI</p>
      <h1>Native HTML, CSS, and JavaScript.</h1>
      <p class="lede">A dependency-free button boilerplate with Bootstrap-like classes and native HTML semantics.</p>

      <section aria-labelledby="button-examples">
        <h2 id="button-examples">Buttons</h2>
        <div class="button-row">
          <button class="btn btn-primary" type="button">Primary</button>
          <button class="btn btn-secondary" type="button">Secondary</button>
          <button class="btn btn-success" type="button">Success</button>
          <button class="btn btn-danger" type="button">Danger</button>
          <button class="btn btn-outline-primary" type="button">Outline</button>
          <button class="btn btn-primary" type="button" disabled>Disabled</button>
        </div>
      </section>

      <section aria-labelledby="button-sizes">
        <h2 id="button-sizes">Sizes</h2>
        <div class="button-row">
          <button class="btn btn-primary btn-sm" type="button">Small</button>
          <button class="btn btn-primary" type="button">Default</button>
          <button class="btn btn-primary btn-lg" type="button">Large</button>
        </div>
      </section>
    </main>
  </body>
</html>
